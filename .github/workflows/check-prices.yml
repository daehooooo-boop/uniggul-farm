# 관심 상품 가격 확인을 3시간마다 부른다 (Vercel 무료 요금제의 예약 작업은 하루 1번뿐이라서).
# 저장소 Settings → Secrets and variables → Actions 에 SITE_URL, CRON_SECRET 을 넣어 두면 된다.
name: check-prices
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/check
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "SITE_URL/CRON_SECRET not set, skipping"; exit 0; fi
          curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/check"
